# =============================================
# MotherCare API - Spring Boot Configuration
# =============================================

# --- Server ---
server.port=8080

# --- DataSource ---
spring.datasource.url=jdbc:mysql://127.0.0.1:3308/mothercare_db?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Security ---
spring.security.user.name=disabled
spring.security.user.password=disabled